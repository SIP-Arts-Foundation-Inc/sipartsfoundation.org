<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SIP Arts Foundation — Website Editor</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #f7f5f1; color: #1b2a4a; text-align: center; padding: 24px;
    }
    #loading p { margin: 8px 0 0; font-size: 15px; }
    #loading strong { font-size: 18px; }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <strong>SIP Arts Foundation</strong>
      <p>Loading the website editor…</p>
      <p style="opacity:.7;font-size:13px">If this does not load, sign in to GitHub first and refresh.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    window.addEventListener('load', function () {
      var el = document.getElementById('loading');
      if (el) setTimeout(function () { el.remove(); }, 1200);
    });
  </script>
</body>
</html>

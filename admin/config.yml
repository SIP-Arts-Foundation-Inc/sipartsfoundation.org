# Decap CMS configuration — SIP Arts Foundation
#
# Team members sign in at /admin with their own GitHub account and edit
# the words on the page they are responsible for. Saving publishes
# straight to the live site, and Shauna is emailed every change.

backend:
  name: github
  repo: SIP-Arts-Foundation-Inc/sipartsfoundation.org
  branch: main
  base_url: https://sip-decap-oauth.shauna-276.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Remove {{collection}} "{{slug}}"'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

# Saves publish immediately. No approval queue.

# Where uploaded images go.
media_folder: 'uploads'
public_folder: '/uploads'

locale: 'en'

collections:
  - name: 'programs'
    label: 'Program pages'
    label_singular: 'program page'
    description: >-
      Edit the words on your program page. Saving publishes it to the
      live site within a few minutes.
    files:
      - name: 'unmasking'
        label: 'Unmasking in the MetroEast'
        file: 'content/unmasking.md'
        fields:
          - { name: 'title', label: 'Page title', widget: 'string' }
          - { name: 'intro', label: 'Opening paragraph', widget: 'text', required: false }
          - { name: 'body', label: 'Opening section, under the title', widget: 'markdown' }
          - { name: 'lede', label: 'Yard sign line, the large text', widget: 'text' }
          - { name: 'pull', label: 'Highlighted sentence', widget: 'text' }
          - { name: 'landfill', label: 'Landfill paragraph, in the tinted box', widget: 'text' }
          - { name: 'doing', label: 'What we are actually doing', widget: 'text' }
          - { name: 'flow', label: 'How it works, four steps. Start each with **the step name**', widget: 'markdown' }
          - { name: 'why', label: 'Why unmasking', widget: 'markdown' }
          - { name: 'education', label: 'Why this is education, not decoration', widget: 'markdown' }
          - { name: 'whocan', label: 'Who can take part, the list', widget: 'markdown' }
          - { name: 'whocan_note', label: 'Who can take part, the note underneath', widget: 'text' }
          - { name: 'donate', label: 'Donate your signs', widget: 'text' }
          - { name: 'sponsor', label: 'Fund or sponsor this project', widget: 'text' }
          - { name: 'questions', label: 'Questions', widget: 'text' }

      - name: 'studio'
        label: 'Pathways to Expression (studio)'
        file: 'content/studio.md'
        fields:
          - { name: 'title', label: 'Program name', widget: 'string' }
          - { name: 'body', label: 'Opening description', widget: 'markdown' }

      - name: 'psa'
        label: 'Pathways Self-Advocates'
        file: 'content/psa.md'
        fields:
          - { name: 'title', label: 'Program name', widget: 'string' }
          - { name: 'lede', label: 'Opening line at the top of the page', widget: 'text' }
          - { name: 'body', label: 'About the group', widget: 'markdown' }

      - name: 'perfectly-imperfect'
        label: 'Perfectly Imperfect Arts'
        file: 'content/perfectly-imperfect.md'
        fields:
          - { name: 'title', label: 'Program name', widget: 'string' }
          - { name: 'lede', label: 'Opening line', widget: 'text' }
          - { name: 'pull', label: 'Highlighted sentence', widget: 'text' }
          - { name: 'body', label: 'About the group', widget: 'markdown' }

      - name: 'transition'
        label: 'Life After High School (transition)'
        file: 'content/transition.md'
        fields:
          - { name: 'title', label: 'Page title', widget: 'string' }
          - { name: 'lede', label: 'Opening line', widget: 'text' }
          - { name: 'pull', label: 'Highlighted sentence', widget: 'text' }
          - { name: 'body', label: 'About these sessions', widget: 'markdown' }

  - name: 'pages'
    label: 'Other pages'
    label_singular: 'page'
    description: >-
      Edit the words on these pages. Saving publishes to the live site
      within a few minutes.
    files:
      - name: 'events'
        label: 'Events page introduction'
        file: 'content/events.md'
        fields:
          - { name: 'title', label: 'Section heading note', widget: 'string' }
          - { name: 'body', label: 'Introduction above the event list', widget: 'markdown' }

      - name: 'survey'
        label: 'Caregiver survey page'
        file: 'content/survey.md'
        fields:
          - { name: 'title', label: 'Page title', widget: 'string' }
          - { name: 'intro', label: 'Opening paragraph', widget: 'text', required: false }
          - { name: 'body', label: 'Page content', widget: 'markdown' }

      - name: 'signin'
        label: 'Event sign-in page'
        file: 'content/signin.md'
        fields:
          - { name: 'title', label: 'Page title', widget: 'string' }
          - { name: 'intro', label: 'Opening paragraph', widget: 'text', required: false }
          - { name: 'body', label: 'Page content', widget: 'markdown' }

  - name: 'events'
    label: 'Events on the calendar'
    label_singular: 'event'
    description: >-
      Add an event and it appears on the events calendar within a few
      minutes. One entry per date. For something that repeats, add one
      entry for each date so people can see every one.
    folder: 'content/events'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: 'Our events', field: 'kind', pattern: 'sip' }
      - { label: 'Partner events', field: 'kind', pattern: 'partner' }
    fields:
      - { name: 'title', label: 'Event name', widget: 'string',
          hint: 'What people will see on the calendar, for example Family Day Out' }
      - { name: 'date', label: 'Date', widget: 'datetime',
          date_format: 'YYYY-MM-DD', time_format: false, picker_utc: false,
          hint: 'The day it happens' }
      - { name: 'time', label: 'Time', widget: 'string', required: false,
          hint: 'Written how you would say it, for example 1:00 to 3:00 PM' }
      - { name: 'location', label: 'Where', widget: 'string', required: false,
          default: '424 Lebanon Ave, Belleville',
          hint: 'An address, or On Zoom' }
      - name: 'kind'
        label: 'Whose event'
        widget: 'select'
        default: 'sip'
        options:
          - { label: 'Our event', value: 'sip' }
          - { label: 'Partner event', value: 'partner' }
      - { name: 'url', label: 'Link', widget: 'string', required: false,
          hint: 'Where the Register button goes, for example /unmasking/ or a full https link. Leave empty for no button' }
      - { name: 'note', label: 'Short note', widget: 'text', required: false,
          hint: 'One line shown when someone taps the event, for example Drop in anytime' }
